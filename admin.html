<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-wrap { max-width: 820px; margin: 48px auto; padding: 0 5%; }
    .admin-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; margin-bottom: 1.5rem; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
    .admin-note { font-size: 0.88rem; color: var(--muted); margin-bottom: 1.25rem; }
    .project-row { border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; background: var(--bg); }
    .project-row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .btn-danger { background: #dc2626; color: #fff; padding: 6px 12px; font-size: 0.82rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Sourav<span>.</span> Admin</a>
      <nav class="nav-links">
        <a href="index.html">← View Portfolio</a>
      </nav>
    </div>
  </header>

  <main class="admin-wrap">
    <section id="loginSection" class="admin-card">
      <h2 class="section-title" style="margin-bottom: 0.75rem;">Admin Login</h2>
      <p class="admin-note">Enter your admin passcode to edit portfolio content.</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="adminPass">Passcode</label>
          <input type="password" id="adminPass" placeholder="Enter passcode" required />
        </div>
        <button type="submit" class="btn btn-primary">Unlock Admin Panel</button>
        <p id="loginError" class="form-status" style="color: #f87171;"></p>
      </form>
    </section>

    <section id="dashboardSection" class="hidden">
      <div class="admin-header">
        <div>
          <h1 style="font-size: 1.8rem;">Portfolio Admin Panel</h1>
          <p class="admin-note" style="margin-bottom: 0;">Changes are saved in your browser's localStorage and previewed live on index.html.</p>
        </div>
        <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
          <a href="index.html" class="btn btn-secondary">Preview Site</a>
          <button type="button" id="logoutBtn" class="btn btn-secondary">Lock</button>
        </div>
      </div>

      <form id="adminForm">
        <div class="admin-card">
          <h2 style="margin-bottom: 1rem;">Profile &amp; Hero</h2>
          <div class="form-group">
            <label for="editName">Full Name</label>
            <input type="text" id="editName" required />
          </div>
          <div class="form-group">
            <label for="editBadge">Status Badge</label>
            <input type="text" id="editBadge" required />
          </div>
          <div class="form-group">
            <label for="editHeroSub">Hero Subtitle</label>
            <textarea id="editHeroSub" rows="2" required></textarea>
          </div>
          <div class="form-group">
            <label for="editAbout">About Me Bio</label>
            <textarea id="editAbout" rows="3" required></textarea>
          </div>
        </div>

        <div class="admin-card">
          <h2 style="margin-bottom: 1rem;">Contact Links</h2>
          <div class="form-group">
            <label for="editEmail">Email Address</label>
            <input type="email" id="editEmail" required />
          </div>
          <div class="form-group">
            <label for="editWhatsapp">WhatsApp Number (with country code, digits only, e.g. 8801755101237)</label>
            <input type="text" id="editWhatsapp" required />
          </div>
          <div class="form-group">
            <label for="editMessenger">Facebook Messenger Username (e.g. souravhossen99)</label>
            <input type="text" id="editMessenger" required />
          </div>
        </div>

        <div class="admin-card">
          <div class="admin-header" style="margin-bottom: 1rem;">
            <h2>Projects</h2>
            <button type="button" id="addProjectBtn" class="btn btn-secondary">+ Add Project</button>
          </div>
          <div id="projectsEditor"></div>
        </div>

        <div class="admin-card">
          <h2 style="margin-bottom: 1rem;">Security (Change Passcodes)</h2>
          <div class="form-group">
            <label for="editEntryPass">New Secret Entry Key (Footer "Sourav" Click)</label>
            <input type="password" id="editEntryPass" placeholder="Leave blank to keep current" />
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label for="editAdminPass">New Admin Panel Passcode</label>
            <input type="password" id="editAdminPass" placeholder="Leave blank to keep current" />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <button type="button" id="resetBtn" class="btn btn-secondary">Reset to Default</button>
        </div>
        <p id="saveStatus" class="form-status"></p>
      </form>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
